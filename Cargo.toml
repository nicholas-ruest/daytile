[package]
name = "daytile"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Render deterministic calendar heatmaps from dated JSONL values"
license = "MIT"
repository = "https://github.com/nicholas-ruest/daytile"
readme = "README.md"
keywords = ["calendar", "heatmap", "svg", "jsonl", "cli"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
